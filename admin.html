<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - All Orders</title>
    <style>
        body {font-family: 'Segoe UI', sans-serif; margin:20px; background:#f8f9fa;}
        h1 {text-align:center; color:#333; margin-bottom:5px;}
        h2 {color:#334d8f; margin-top:30px; border-bottom:2px solid #334d8f; padding-bottom:8px;}
        table {width:100%; border-collapse:collapse; margin-top:10px; background:white;}
        th, td {padding:12px; border:1px solid #ddd; text-align:left;}
        th {background:#334d8f; color:white;}
        .rendang th {background:#d35400;}
        .refresh-btn {
            padding:12px 20px; 
            background:#28a745; 
            color:white; 
            border:none; 
            border-radius:8px; 
            cursor:pointer; 
            font-size:16px;
        }
        .section {margin-bottom:40px;}
    </style>
</head>
<body>
    <h1>📋 Admin Panel - All Orders</h1>
    <button class="refresh-btn" onclick="loadAllOrders()">🔄 Refresh All Orders</button>

    <!-- Rice Dumpling Orders -->
    <div class="section">
        <h2>🍚 Rice Dumpling Orders</h2>
        <table id="riceTable">
            <thead>
                <tr>
                    <th>Order Time</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Collection Date</th>
                    <th>Collection Point</th>
                    <th>Hokkien</th>
                    <th>Nyonya</th>
                    <th>Total Qty</th>
                    <th>Total (RM)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Beef Rendang Orders -->
    <div class="section">
        <h2>🥩 Beef Rendang Orders</h2>
        <table id="rendangTable">
            <thead>
                <tr>
                    <th>Order Time</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Collection Date</th>
                    <th>Collection Point</th>
                    <th>Quantity</th>
                    <th>Total (RM)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://gnfsbbnekmbgttrhmavu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FlPMHCir5_TOuROiv0DwNw_deMtyPI-";

        async function loadAllOrders() {
            // Load Rice Dumpling Orders
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                const orders = await res.json();
                const tbody = document.querySelector('#riceTable tbody');
                tbody.innerHTML = '';

                orders.forEach(o => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${new Date(o.created_at).toLocaleString()}</td>
                        <td>${o.name}</td>
                        <td>${o.phone}</td>
                        <td>${o.collection_date}</td>
                        <td>${o.collection_point}</td>
                        <td>${o.hokkien_qty || 0}</td>
                        <td>${o.nyonya_qty || 0}</td>
                        <td><strong>${(o.hokkien_qty || 0) + (o.nyonya_qty || 0)}</strong></td>
                        <td>RM${o.total_price || 0}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (e) {
                console.error("Rice orders error", e);
            }

            // Load Beef Rendang Orders
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/beef_rendang_orders?order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                const orders = await res.json();
                const tbody = document.querySelector('#rendangTable tbody');
                tbody.innerHTML = '';

                orders.forEach(o => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${new Date(o.created_at).toLocaleString()}</td>
                        <td>${o.name}</td>
                        <td>${o.phone}</td>
                        <td>${o.collection_date}</td>
                        <td>${o.collection_point}</td>
                        <td><strong>${o.rendang_qty || 0}</strong></td>
                        <td>RM${o.total_price || 0}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (e) {
                console.error("Rendang orders error", e);
            }
        }

        window.onload = loadAllOrders;
    </script>
</body>
</html>
