<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - All Orders</title>
    <style>
        body {font-family: 'Segoe UI', sans-serif; margin:20px; background:#f8f9fa;}
        h1 {text-align:center; color:#333;}
        h2 {color:#334d8f; margin:25px 0 10px;}
        table {width:100%; border-collapse:collapse; margin:15px 0; background:white;}
        th, td {padding:12px; border:1px solid #ddd; text-align:left;}
        th {background:#334d8f; color:white;}
        .summary th {background:#28a745;}
        .refresh-btn {
            padding:12px 20px; 
            background:#28a745; 
            color:white; 
            border:none; 
            border-radius:8px; 
            cursor:pointer; 
            font-size:16px;
        }
    </style>
</head>
<body>
    <h1>📋 Admin Panel - Orders Summary</h1>
    <button class="refresh-btn" onclick="loadSummary()">🔄 Refresh Summary</button>

    <!-- Main Summary Table -->
    <h2>📊 Total Dumplings by Collection Date & Type</h2>
    <table id="summaryTable">
        <thead>
            <tr>
                <th>Collection Date</th>
                <th>Dumpling Type</th>
                <th>Total Ordered</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://gnfsbbnekmbgttrhmavu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FlPMHCir5_TOuROiv0DwNw_deMtyPI-";

        async function loadSummary() {
            const tbody = document.querySelector('#summaryTable tbody');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Loading...</td></tr>';

            let rows = [];

            // Rice Dumpling Orders
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                const orders = await res.json();

                const riceSummary = {};
                orders.forEach(o => {
                    const date = o.collection_date;
                    if (!riceSummary[date]) riceSummary[date] = { hokkien: 0, nyonya: 0 };
                    riceSummary[date].hokkien += Number(o.hokkien_qty || 0);
                    riceSummary[date].nyonya += Number(o.nyonya_qty || 0);
                });

                Object.keys(riceSummary).forEach(date => {
                    const s = riceSummary[date];
                    if (s.hokkien > 0) {
                        rows.push({ date, type: "Pork Rice Dumpling (Hokkien)", total: s.hokkien });
                    }
                    if (s.nyonya > 0) {
                        rows.push({ date, type: "Pork Rice Dumpling (Nyonya)", total: s.nyonya });
                    }
                });
            } catch (e) { console.error(e); }

            // Beef Rendang Orders
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/beef_rendang_orders`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                const orders = await res.json();

                const rendangSummary = {};
                orders.forEach(o => {
                    const date = o.collection_date;
                    if (!rendangSummary[date]) rendangSummary[date] = 0;
                    rendangSummary[date] += Number(o.rendang_qty || 0);
                });

                Object.keys(rendangSummary).forEach(date => {
                    if (rendangSummary[date] > 0) {
                        rows.push({ 
                            date, 
                            type: "Beef Rendang Rice Dumpling", 
                            total: rendangSummary[date] 
                        });
                    }
                });
            } catch (e) { console.error(e); }

            // Sort by Collection Date (newest first)
            rows.sort((a, b) => b.date.localeCompare(a.date));

            // Render table
            tbody.innerHTML = '';
            rows.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${r.date}</strong></td>
                    <td>${r.type}</td>
                    <td><strong>${r.total}</strong></td>
                `;
                tbody.appendChild(tr);
            });

            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#666;">No orders yet</td></tr>';
            }
        }

        window.onload = loadSummary;
    </script>
</body>
</html>
