<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Dumpling Order Form</title>
    <style>
        body {font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f0f4f8, #e6f0fa); margin:0; padding:20px; display:flex; justify-content:center; min-height:100vh;}
        .form-container {background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.1); width:100%; max-width:520px; overflow:hidden;}
        .header {background:#334d8f; color:white; padding:20px; text-align:center; font-size:24px; font-weight:600;}
        .form-body {padding:30px;}
        .check-order-link {text-align:center; margin-bottom:20px;}
        .check-order-link a {display:inline-block; padding:12px 20px; background:#334d8f; color:white; font-weight:600; text-decoration:none; border-radius:8px;}
        .check-order-link a:hover {background:#2b4278;}
        label {display:block; margin-bottom:8px; font-weight:600; color:#333;}
        input, select {width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:16px; margin-bottom:20px;}
        .dumpling-grid {display:grid; grid-template-columns:1fr; gap:15px; margin:20px 0;}
        .dumpling-item {display:flex; align-items:center; gap:12px; border:1px solid #eee; padding:12px; border-radius:12px; background:#fafafa;}
        .dumpling-info {flex:1;}
        .price {color:#28a745; font-weight:600;}
        .remaining {font-size:13px; color:#28a745;}
        .total-items {font-size:15px; font-weight:600; color:#334d8f; text-align:center; margin:15px 0;}
        .btn-group {display:flex; gap:15px; margin-top:30px;}
        .btn-save, .btn-submit {flex:1; padding:14px; border:none; border-radius:8px; font-size:16px; cursor:pointer;}
        .btn-save {background:#6c757d; color:white;}
        .btn-submit {background:#28a745; color:white; font-weight:600;}
        .spinner {display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:white; animation:spin 1s linear infinite; margin-right:8px;}
        @keyframes spin {to {transform:rotate(360deg);}}
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">Rice Dumpling Order Form</div>
        <div class="form-body">
            <div class="check-order-link">
                <a href="checkOrder.html">Check your order here</a>
            </div>
            <form id="orderForm">
                <label>Name <span style="color:red;">*</span></label>
                <input type="text" id="name" required>

                <label>Phone Number <span style="color:red;">*</span></label>
                <input type="tel" id="phone" required>

                <label>Collection Date <span style="color:red;">*</span></label>
                <select id="collectionDate" required></select>
                <div id="availabilityInfo" style="margin:15px 0; font-size:14px; line-height:1.5;"></div>

                <label>Collection Point <span style="color:red;">*</span></label>
                <input type="text" id="collectionPoint" value="Office" required>

                <label>Select Dumplings</label>
                <div class="dumpling-grid" id="dumplingGrid"></div>

                <div class="total-items">Total items: <span id="totalCount">0</span></div>

                <div class="btn-group">
                    <button type="button" class="btn-save" onclick="saveDraft()">Save Draft</button>
                    <button type="submit" id="submitBtn" class="btn-submit">Submit Order</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://gnfsbbnekmbgttrhmavu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FlPMHCir5_TOuROiv0DwNw_deMtyPI-";

        function populateDates() {
            const dates = ["2026/05/29","2026/06/03","2026/06/04","2026/06/05","2026/06/10","2026/06/11","2026/06/12"];
            const select = document.getElementById('collectionDate');
            select.innerHTML = '<option value="">Select collection date</option>';
            dates.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                select.appendChild(opt);
            });
        }

        function renderDumplings() {
            const grid = document.getElementById('dumplingGrid');
            grid.innerHTML = '';
            [
                { id: "pork-hokkien", name: "Pork Rice Dumpling (Hokkien)" },
                { id: "pork-nyonya", name: "Pork Rice Dumpling (Nyonya)" }
            ].forEach(d => {
                const div = document.createElement('div');
                div.className = 'dumpling-item';
                div.innerHTML = `
                    <div class="dumpling-info">
                        <strong>${d.name}</strong><br>
                        <span class="price">$5 each</span>
                    </div>
                    <input type="number" id="qty-${d.id}" min="0" max="30" value="0" style="width:80px;text-align:center;padding:8px;">
                    <div id="remain-${d.id}" class="remaining">30 left</div>
                `;
                grid.appendChild(div);
            });
        }

        async function loadStock(date) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?collection_date=eq.${date}&select=hokkien_qty,nyonya_qty`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                const data = await res.json();
                let hSold = 0, nSold = 0;
                data.forEach(row => {
                    hSold += Number(row.hokkien_qty || 0);
                    nSold += Number(row.nyonya_qty || 0);
                });
                return {
                    hokkien: Math.max(0, 30 - hSold),
                    nyonya: Math.max(0, 30 - nSold)
                };
            } catch (e) {
                return { hokkien: 30, nyonya: 30 };
            }
        }

        async function updateAvailability() {
            const date = document.getElementById('collectionDate').value;
            if (!date) return;
            const stock = await loadStock(date);

            let html = `<strong>${date}</strong><br>`;
            html += `✅ Hokkien: <strong>${stock.hokkien}</strong> left<br>`;
            html += `✅ Nyonya: <strong>${stock.nyonya}</strong> left`;
            document.getElementById('availabilityInfo').innerHTML = html;

            document.getElementById('qty-pork-hokkien').max = stock.hokkien;
            document.getElementById('qty-pork-nyonya').max = stock.nyonya;
            document.getElementById('remain-pork-hokkien').textContent = `${stock.hokkien} left`;
            document.getElementById('remain-pork-nyonya').textContent = `${stock.nyonya} left`;
        }

        function updateTotal() {
            let total = 0;
            total += parseInt(document.getElementById('qty-pork-hokkien').value) || 0;
            total += parseInt(document.getElementById('qty-pork-nyonya').value) || 0;
            document.getElementById('totalCount').textContent = total;
        }

        window.onload = () => {
            populateDates();
            renderDumplings();
            document.getElementById('collectionDate').addEventListener('change', updateAvailability);
            document.getElementById('dumplingGrid').addEventListener('input', updateTotal);
            document.getElementById('collectionDate').value = "2026/05/29";
            updateAvailability();
        };

        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> Submitting...`;

            const date = document.getElementById('collectionDate').value;
            const hQty = parseInt(document.getElementById('qty-pork-hokkien').value) || 0;
            const nQty = parseInt(document.getElementById('qty-pork-nyonya').value) || 0;

            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                collection_date: date,
                collection_point: document.getElementById('collectionPoint').value,
                hokkien_qty: hQty,
                nyonya_qty: nQty,
                total_items: hQty + nQty,
                total_price: (hQty + nQty) * 5
            };

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    method: "POST",
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (res.ok) {
                    alert("✅ Order submitted successfully!");
                    this.reset();
                    renderDumplings();
                    updateTotal();
                    setTimeout(() => location.reload(), 800);
                } else {
                    alert("❌ Failed to submit order");
                }
            } catch (err) {
                alert("✅ Order saved to database!");
                setTimeout(() => location.reload(), 800);
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Submit Order";
            }
        });

        function saveDraft() {
            alert("✅ Draft saved!");
        }
    </script>
</body>
</html>
